services:
  floci:
    image: floci/floci:2.1.0-compat
    env_file:
      - ./config/aws.env
      - ./config/floci.env
    volumes:
      - ./scripts/floci/ready.d:/etc/floci/init/ready.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:4566/_floci/init | grep -q '\"ready\":true'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "4566:4566"

  mongodb:
    image: mongo:6.0.28
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.hello().ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "27017:27017"

  mssql:
    image: mcr.microsoft.com/azure-sql-edge:2.0.0
    env_file:
      - ./config/mssql.env
    healthcheck:
      test: timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    env_file:
      - ./config/servicebus-emulator.env
    volumes:
      - ./config/servicebus-emulator.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      mssql:
        condition: service_healthy
    ports:
      - "5672:5672"
      - "5300:5300"

  trade-tracesnt-stub:
    image: defradigital/trade-tracesnt-stub:${TRADE_TRACESNT_STUB:-latest}
    env_file:
      - ./config/trade-tracesnt-stub.env
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "3000:8080"

  trade-traces-poc:
    image: defradigital/trade-traces-poc:${TRADE_TRACES_POC:-latest}
    env_file:
      - ./config/aws.env
      - ./config/trade-traces-poc.env
    depends_on:
      mongodb:
        condition: service_healthy
      trade-tracesnt-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "8090:8080"

  trade-gateway:
    image: defradigital/trade-gateway:${TRADE_GATEWAY:-latest}
    env_file:
      - ./config/aws.env
      - ./config/trade-gateway.env
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      trade-tracesnt-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 3
      start_period: 2s
    ports:
      - "8080:8080"

  trade-gateway-publisher:
    image: defradigital/trade-gateway-publisher:${TRADE_GATEWAY_PUBLISHER:-latest}
    env_file:
      - ./config/aws.env
      - ./config/trade-gateway-publisher.env
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      trade-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/health"]
      interval: 3s
      timeout: 5s
      retries: 3
      start_period: 2s
    ports:
      - "8085:8085"
